services:
  web:
    build: ./php
    container_name: app_php
    ports:
      - "8081:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

    environment:
      MARIADB_HOST: db
      MARIADB_DATABASE: knowitbetter_db
      MARIADB_USER: knowitbetter_user
      MARIADB_PASSWORD: change_user_password

  db:
    image: mariadb:11.4
    container_name: app_db
    environment:
      MARIADB_ROOT_PASSWORD: change_root_password
      MARIADB_HOST: db
      MARIADB_DATABASE: knowitbetter_db
      MARIADB_USER: knowitbetter_user
      MARIADB_PASSWORD: change_user_password
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: app_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data: